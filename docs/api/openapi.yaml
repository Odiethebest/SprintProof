openapi: 3.1.0
info:
  title: SprintProof API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Read your team's sprint data from your own tools, and see every endpoint the
    SprintProof app itself calls.

    ## Authentication
    - **Personal API token.** Create one under Settings → API tokens and send it as
      `Authorization: Bearer spk_live_…`. Tokens only read: they work on the
      `GET` endpoints tagged **Public API** and nowhere else. A token acts as you,
      so it sees the teams you're on, with your role.
    - **Session cookie.** Every other endpoint needs a signed-in session in the
      browser and ignores tokens.

    A request with an `Authorization` header is checked by its token alone, even
    when it also carries a session cookie.

    ## Errors
    Every error has the same shape, with a stable `code` and a message you can show:
    `{ "error": { "code": "SPRINT_NOT_FOUND", "message": "Sprint not found." } }`

    Codes by status:
    - 400: `VALIDATION_ERROR`, `INVALID_CURSOR`
    - 401: `UNAUTHENTICATED`, `INVALID_TOKEN`
    - 403: `FORBIDDEN`
    - 404: `NOT_FOUND`, `SPRINT_NOT_FOUND`, `INVITE_NOT_FOUND`, `TOKEN_NOT_FOUND`,
      `RETRO_NOT_FOUND`, `RETRO_ITEM_NOT_FOUND`, `ACTION_ITEM_NOT_FOUND`
    - 409: `REPO_ALREADY_CONNECTED`, `NO_CURRENT_SPRINT`, `STANDUP_DAY_CHANGED`,
      `RETRO_EXISTS`, `RETRO_CLOSED`, `NO_VOTES_LEFT`, `NO_NEXT_SPRINT`
    - 410: `INVITE_REVOKED`, `INVITE_EXPIRED`
    - 500: `INTERNAL_ERROR`, when something fails on the server, such as the
      database. The response says nothing about the failure; try again in a moment.

    ## Pagination
    List endpoints return `{ "data": [...], "nextCursor": "..." }`. Pass
    `nextCursor` back as `?cursor=` for the next page; it is `null` on the last page.
    `?limit=` sets the page size, from 1 to 100 (default 20).

    ## Counting rules
    Counts follow the rules in the README: one standup per person per day in the
    team's timezone, reviews count distinct PRs by someone else, and bot activity
    is ignored. Peer feedback is never part of any response.
servers:
  - url: /api/v1
tags:
  - name: Public API
    description: Read-only. Takes a personal API token or a session.
  - name: Teams
    description: Session only. Create a team for a GitHub repo.
  - name: Invites
    description: Session only, lead only. Member and instructor invite links.
  - name: Webhook secret
    description: Session only, lead only. Rotate the secret that signs the team's GitHub webhook.
  - name: Memberships
    description: Session only. Join a team through an invite link.
  - name: Sprints
    description: Session only, lead only. Add and edit sprints and their requirements.
  - name: Standups
    description: Session only. Post today's standup.
  - name: Retros
    description: |
      Session only. A sprint's retro: the lead opens and closes it; leads and
      members add items, vote (3 votes each, 1 per item) and check off the
      action items carried in from the previous retro. Instructors only read it.
  - name: API tokens
    description: Session only. Create and revoke personal API tokens.
# Validation (#74): user text rejects NUL with 400 VALIDATION_ERROR.
# NUL URL ids follow the same 403/404 behavior as unknown ids. NUL inviteToken
# in the JSON body is a validation error; NUL invite-link URL tokens are absent.
# Sprint dates must be within 2000-01-01 and 2100-12-31 inclusive.
# Sprint names are trimmed and limited to 100 characters.
paths:
  /teams:
    get:
      tags: [Public API]
      summary: List your teams
      description: |
        The teams you're on, with your role on each, in the order you joined
        them. With a token, that's the token owner's teams.
      operationId: listTeams
      security:
        - bearerToken: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of your teams.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamList"
        "400":
          $ref: "#/components/responses/BadPageQuery"
        "401":
          $ref: "#/components/responses/TokenOrSessionMissing"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Teams]
      summary: Create a team
      description: >-
        The signed-in user becomes the team's lead. The team's repository is
        pending until GitHub delivers a ping signed with the team's webhook
        secret, and only then counts as connected. Other teams can have the
        same repository pending (decision 007).
      operationId: createTeam
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamInput"
      responses:
        "201":
          description: The new team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          description: >-
            Another team already connected this repo: GitHub's ping verified
            it for that team. The name is compared ignoring letter case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: REPO_ALREADY_CONNECTED
                  message: Another team already connected this repo.
        "500":
          $ref: "#/components/responses/InternalError"
  /teams/{teamId}:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    get:
      tags: [Public API]
      summary: Get a team and its members
      description: |
        The team's repo and timezone, and each lead, member and instructor with
        their role, leads first. Any team member can read it. Someone who isn't
        on the team gets 403, the same as for a team that doesn't exist.
      operationId: getTeam
      security:
        - bearerToken: []
        - sessionCookie: []
      responses:
        "200":
          description: The team and its members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamWithMembers"
        "401":
          $ref: "#/components/responses/TokenOrSessionMissing"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /teams/{teamId}/invites:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    post:
      tags: [Invites]
      summary: Create an invite link
      description: |
        Who may create which link (decision 006):

        - `MEMBER` links: the team's lead.
        - `INSTRUCTOR` links: course staff (the GitHub logins in the server's
          `COURSE_STAFF_GITHUB_LOGINS`), even when they aren't on the team, and
          the team's instructors. A lead who isn't course staff can't.

        Session only: an API token isn't accepted. Course staff who aren't on
        the team can call this from `/api-docs` after signing in; the team id is
        in the address of any team page (`/teams/{teamId}/...`). Join the link at
        `/invite/{token}`.

        Links expire after 7 days. Creating a link revokes the team's current
        link for the same role, so each role has at most one working link.
      operationId: createInvite
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [MEMBER, INSTRUCTOR]
      responses:
        "201":
          description: The new invite link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            You can't create this link: a lead asking for an `INSTRUCTOR` link,
            an instructor or course staff asking for a `MEMBER` link, a member,
            or someone who isn't on the team and isn't course staff. A team that
            doesn't exist gets the same answer, for course staff too.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: FORBIDDEN
                  message: Only course staff and the team's instructors can create and revoke instructor invite links.
        "500":
          $ref: "#/components/responses/InternalError"
  /teams/{teamId}/invites/{inviteId}:
    parameters:
      - $ref: "#/components/parameters/TeamId"
      - name: inviteId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [Invites]
      summary: Revoke an invite link
      description: |
        Whoever may create links for the link's role may revoke it: the lead
        revokes member links; course staff (on the team or not) and the team's
        instructors revoke instructor links (decision 006). Session only.
        Revoking a link twice is not an error.
      operationId: revokeInvite
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            You can't revoke this link: a lead revoking an instructor link, an
            instructor or course staff revoking a member link, a member, or
            someone who isn't on the team and isn't course staff. A team that
            doesn't exist gets the same answer, for course staff too.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: FORBIDDEN
                  message: Only course staff and the team's instructors can create and revoke instructor invite links.
        "404":
          description: The team has no invite link with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INVITE_NOT_FOUND
                  message: This team has no invite link with that id.
        "500":
          $ref: "#/components/responses/InternalError"
  /teams/{teamId}/webhook-secret:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    post:
      tags: [Webhook secret]
      summary: Rotate the team's webhook secret
      description: |
        Lead only, with a session. Replaces the secret that signs the team's
        GitHub webhook deliveries with a new random one (decision 005).
        Deliveries signed with the old secret get 401 from then on, so paste
        the new one into the webhook on GitHub: copy it from Settings →
        Repository. No response contains the secret itself, only its last 4
        characters.
      operationId: rotateWebhookSecret
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The secret was replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSecretRotation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /memberships:
    post:
      tags: [Memberships]
      summary: Join a team with an invite token
      description: |
        Adds the signed-in user with the link's role. If they're already on the
        team, their role stays as it is.
      operationId: joinTeam
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteToken]
              properties:
                inviteToken:
                  type: string
                  description: The last part of the invite link.
      responses:
        "201":
          description: Joined the team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "200":
          description: Already on the team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: No invite link has this token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INVITE_NOT_FOUND
                  message: This invite link doesn't work. Check that you copied the whole link, or ask your team lead for a new one.
        "410":
          description: "The link was revoked (`INVITE_REVOKED`) or has expired (`INVITE_EXPIRED`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INVITE_EXPIRED
                  message: This invite link has expired. Ask your team lead for a new one.
        "500":
          $ref: "#/components/responses/InternalError"
  /teams/{teamId}/sprints:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    get:
      tags: [Public API]
      summary: List a team's sprints
      description: Oldest first. Any team member can list them.
      operationId: listSprints
      security:
        - bearerToken: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of sprints.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SprintList"
        "400":
          $ref: "#/components/responses/BadPageQuery"
        "401":
          $ref: "#/components/responses/TokenOrSessionMissing"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Sprints]
      summary: Add a sprint
      description: |
        Lead only. Dates are calendar days in the team's timezone; the sprint runs
        from 00:00 on the start date through the end of the end date. Sprints in
        one team can't overlap.
      operationId: createSprint
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSprintInput"
      responses:
        "201":
          description: The new sprint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sprint"
        "400":
          $ref: "#/components/responses/SprintValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /teams/{teamId}/sprints/{sprintId}:
    parameters:
      - $ref: "#/components/parameters/TeamId"
      - $ref: "#/components/parameters/SprintId"
    patch:
      tags: [Sprints]
      summary: Edit a sprint
      description: |
        Lead only. Fields you leave out keep their stored values. Standups stay
        with their days, so new dates move standups into or out of this sprint.
      operationId: updateSprint
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSprintInput"
      responses:
        "200":
          description: The edited sprint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sprint"
        "400":
          $ref: "#/components/responses/SprintValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SprintNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /teams/{teamId}/sprints/{sprintId}/summary:
    parameters:
      - $ref: "#/components/parameters/TeamId"
      - $ref: "#/components/parameters/SprintId"
    get:
      tags: [Public API]
      summary: Get a sprint's counts per member
      description: |
        Commits, opened PRs, standups and PR reviews for each lead and member,
        with each requirement's status, as the dashboard shows them. Instructors
        have no requirements, so they aren't listed. Any team member can read it.
      operationId: getSprintSummary
      security:
        - bearerToken: []
        - sessionCookie: []
      responses:
        "200":
          description: The sprint's summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SprintSummary"
        "401":
          $ref: "#/components/responses/TokenOrSessionMissing"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SprintNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /teams/{teamId}/sprints/{sprintId}/standups:
    parameters:
      - $ref: "#/components/parameters/TeamId"
      - $ref: "#/components/parameters/SprintId"
    get:
      tags: [Public API]
      summary: List a sprint's standups
      description: Newest first. Any team member can list them.
      operationId: listSprintStandups
      security:
        - bearerToken: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of standups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandupList"
        "400":
          $ref: "#/components/responses/BadPageQuery"
        "401":
          $ref: "#/components/responses/TokenOrSessionMissing"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SprintNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /teams/{teamId}/sprints/{sprintId}/retro:
    parameters:
      - $ref: "#/components/parameters/TeamId"
      - $ref: "#/components/parameters/SprintId"
    get:
      tags: [Retros]
      summary: Get a sprint's retro
      description: |
        Items in vote order (ties: the earliest created first), with your votes
        and how many you have left. Once the retro is closed, `actionItems` lists
        the next sprint's action items it made. Anyone on the team can read it.
      operationId: getRetro
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The sprint's retro.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Retro"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The team has no sprint with this id (`SPRINT_NOT_FOUND`), or the lead hasn't opened its retro yet (`RETRO_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: RETRO_NOT_FOUND
                  message: The lead hasn't opened this sprint's retro yet.
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Retros]
      summary: Open a sprint's retro
      description: Lead only. Each sprint has one retro; members can add items and vote once it's open.
      operationId: openRetro
      security:
        - sessionCookie: []
      responses:
        "201":
          description: The new, empty retro.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Retro"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SprintNotFound"
        "409":
          description: The sprint already has a retro, open or closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: RETRO_EXISTS
                  message: This sprint already has a retro.
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Retros]
      summary: Close a sprint's retro
      description: |
        Lead only. The top 3 "To improve" items by votes (ties: the earliest
        created) become action items for the sprint that starts next. After
        that, the retro's items and votes can't change. A closed retro can't be
        reopened.
      operationId: closeRetro
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [CLOSED]
      responses:
        "200":
          description: The closed retro, with the action items it made.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Retro"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The team has no sprint with this id (`SPRINT_NOT_FOUND`), or the lead hasn't opened its retro yet (`RETRO_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: RETRO_NOT_FOUND
                  message: The lead hasn't opened this sprint's retro yet.
        "409":
          description: The retro is already closed (`RETRO_CLOSED`), or the team has no sprint after this one to carry the action items into (`NO_NEXT_SPRINT`). Nothing changes in either case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: NO_NEXT_SPRINT
                  message: Add the next sprint in Settings first. Its action items come from this retro.
        "500":
          $ref: "#/components/responses/InternalError"
  /teams/{teamId}/sprints/{sprintId}/retro/items:
    parameters:
      - $ref: "#/components/parameters/TeamId"
      - $ref: "#/components/parameters/SprintId"
    post:
      tags: [Retros]
      summary: Add a retro item
      description: Leads and members only, while the retro is open. You're its author.
      operationId: addRetroItem
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetroItemInput"
      responses:
        "201":
          description: The new item, with no votes yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetroItem"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RetroNotFound"
        "409":
          $ref: "#/components/responses/RetroClosed"
        "500":
          $ref: "#/components/responses/InternalError"
  /teams/{teamId}/sprints/{sprintId}/retro/items/{itemId}/vote:
    parameters:
      - $ref: "#/components/parameters/TeamId"
      - $ref: "#/components/parameters/SprintId"
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [Retros]
      summary: Vote for a retro item
      description: |
        Leads and members only, while the retro is open. You have 3 votes per
        retro and at most 1 per item: voting for the same item again changes
        nothing, and a 4th vote is refused.
      operationId: voteForRetroItem
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Your vote is on the item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetroVoteState"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RetroItemNotFound"
        "409":
          description: The retro is closed (`RETRO_CLOSED`), or you've used your 3 votes in it (`NO_VOTES_LEFT`). Nothing is saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: NO_VOTES_LEFT
                  message: You've used your 3 votes in this retro. Take one back to vote for this item.
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Retros]
      summary: Take your vote back
      description: Leads and members only, while the retro is open. Taking back a vote you didn't cast changes nothing.
      operationId: takeBackRetroVote
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Your vote is off the item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetroVoteState"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RetroItemNotFound"
        "409":
          $ref: "#/components/responses/RetroClosed"
        "500":
          $ref: "#/components/responses/InternalError"
  /teams/{teamId}/sprints/{sprintId}/retro/action-items/{actionItemId}:
    parameters:
      - $ref: "#/components/parameters/TeamId"
      - $ref: "#/components/parameters/SprintId"
      - name: actionItemId
        in: path
        required: true
        description: An action item carried into this sprint, from the previous retro's `actionItems`.
        schema:
          type: string
    patch:
      tags: [Retros]
      summary: Check an action item off
      description: |
        Leads and members only. Marks an action item carried into this sprint
        done or not done, until this sprint's own retro closes.
      operationId: updateActionItem
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isDone]
              properties:
                isDone:
                  type: boolean
      responses:
        "200":
          description: The action item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionItem"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The team has no sprint with this id (`SPRINT_NOT_FOUND`), or no action item with this id was carried into it (`ACTION_ITEM_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: ACTION_ITEM_NOT_FOUND
                  message: Action item not found.
        "409":
          description: This sprint's retro is closed, so its action items can't change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: RETRO_CLOSED
                  message: This sprint's retro is closed, so its action items can't change.
        "500":
          $ref: "#/components/responses/InternalError"
  /teams/{teamId}/standups:
    parameters:
      - $ref: "#/components/parameters/TeamId"
    post:
      tags: [Standups]
      summary: Post or update today's standup
      description: |
        Leads and members only. The server files it under today's date in the
        team's timezone and under the current sprint. Posting again the same day
        updates that standup instead of adding a second one.
      operationId: postStandup
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandupInput"
      responses:
        "201":
          description: Posted today's standup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Standup"
        "200":
          description: Updated today's standup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Standup"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The team doesn't exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: NOT_FOUND
                  message: This team doesn't exist.
        "409":
          description: Today isn't inside any sprint (NO_CURRENT_SPRINT), or formDate differs from today in the team timezone (STANDUP_DAY_CHANGED). Nothing is saved in either case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: NO_CURRENT_SPRINT
                  message: Today isn't in any sprint. A lead can add one in Settings.
        "500":
          $ref: "#/components/responses/InternalError"
  /tokens:
    post:
      tags: [API tokens]
      summary: Create a personal API token
      # A successful creation is final even if the client cannot read the response.
      # A lost one-time secret requires revoking the token and creating another.
      description: |
        The response is the only time the token is shown; SprintProof keeps only
        its SHA-256 hash. Session only: a token can't create tokens.
      operationId: createApiToken
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 50
                  description: Spaces around the name are trimmed.
      responses:
        "201":
          description: The new token, shown this once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewApiToken"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /tokens/{tokenId}:
    parameters:
      - name: tokenId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [API tokens]
      summary: Revoke a personal API token
      description: The token stops working at once. Session only.
      operationId: revokeApiToken
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: You have no token with that id. Someone else's token gets the same answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: TOKEN_NOT_FOUND
                  message: You have no API token with that id.
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: A personal API token, `spk_live_` followed by 43 characters.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-authjs.session-token
      description: The session cookie set when you sign in with GitHub.
  parameters:
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
    SprintId:
      name: sprintId
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: The `nextCursor` from the previous page. Leave it out for the first page.
      schema:
        type: string
        minLength: 1
  responses:
    ValidationError:
      description: The request body isn't valid, including NUL characters in user text. The message names the first problem.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: VALIDATION_ERROR
              message: Send the request body as JSON.
    SprintValidationError:
      description: |
        The sprint isn't valid: a missing name, a name over 100 characters or containing NUL, a date outside years 2000–2100 or not YYYY-MM-DD, an end
        date before the start date, dates that overlap another sprint (including concurrent creates and edits), or a
        requirement outside 1–20.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: VALIDATION_ERROR
              message: Dates overlap with existing sprint "Sprint 1".
    BadPageQuery:
      description: |
        `limit` isn't a whole number from 1 to 100 (`VALIDATION_ERROR`), or
        `cursor` isn't from this list (`INVALID_CURSOR`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            limit:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Set limit to a whole number from 1 to 100.
            cursor:
              value:
                error:
                  code: INVALID_CURSOR
                  message: This cursor isn't from this list. Use the nextCursor from the previous page.
    Unauthenticated:
      description: No signed-in session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UNAUTHENTICATED
              message: Sign in to continue.
    TokenOrSessionMissing:
      description: |
        No token and no session (`UNAUTHENTICATED`), or the `Authorization` header
        doesn't hold a working token (`INVALID_TOKEN`): it is malformed, was never
        created, or was revoked.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missing:
              value:
                error:
                  code: UNAUTHENTICATED
                  message: Sign in to continue.
            invalid:
              value:
                error:
                  code: INVALID_TOKEN
                  message: This API token isn't valid. Create a new one in Settings.
    Forbidden:
      description: You aren't on this team, the team doesn't exist, or your role can't do this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: FORBIDDEN
              message: You don't have permission to do this on this team.
    InternalError:
      description: |
        Something failed on the server, such as the database. The response says
        nothing about the failure. Try again in a moment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INTERNAL_ERROR
              message: Something went wrong on our side. Try again in a moment.
    RetroNotFound:
      description: The team has no sprint with this id (`SPRINT_NOT_FOUND`), or the lead hasn't opened its retro yet (`RETRO_NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: RETRO_NOT_FOUND
              message: The lead hasn't opened this sprint's retro yet.
    RetroItemNotFound:
      description: |
        The team has no sprint with this id (`SPRINT_NOT_FOUND`), the lead hasn't
        opened its retro (`RETRO_NOT_FOUND`), or the retro has no item with this
        id (`RETRO_ITEM_NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: RETRO_ITEM_NOT_FOUND
              message: Retro item not found.
    RetroClosed:
      description: The retro is closed, so its items and votes can't change. Nothing is saved.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: RETRO_CLOSED
              message: This retro is closed, so its items and votes can't change.
    SprintNotFound:
      description: The team has no sprint with this id.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: SPRINT_NOT_FOUND
              message: Sprint not found.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, in SNAKE_CASE. Branch on this, not on the message.
            message:
              type: string
              description: A sentence you can show to people.
    Team:
      type: object
      required: [id, name, repoFullName, timezone]
      properties:
        id:
          type: string
        name:
          type: string
        repoFullName:
          type: string
          examples: [Odiethebest/SprintProof]
        timezone:
          type: string
          description: IANA timezone for sprint days and standup dates.
          examples: [America/Los_Angeles]
    TeamWithRole:
      allOf:
        - $ref: "#/components/schemas/Team"
        - type: object
          required: [role]
          properties:
            role:
              $ref: "#/components/schemas/Role"
              description: Your role on this team.
    TeamList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TeamWithRole"
        nextCursor:
          type: [string, "null"]
    TeamMember:
      type: object
      required: [userId, name, githubLogin, role]
      properties:
        userId:
          type: string
          description: The same id as `userId` in sprint summaries and standups.
        name:
          type: [string, "null"]
        githubLogin:
          type: [string, "null"]
        role:
          $ref: "#/components/schemas/Role"
    TeamWithMembers:
      allOf:
        - $ref: "#/components/schemas/Team"
        - type: object
          required: [members]
          properties:
            members:
              type: array
              description: Leads first, then members, then instructors, each in the order they joined.
              items:
                $ref: "#/components/schemas/TeamMember"
    CreateTeamInput:
      type: object
      required: [name, repoFullName]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        repoFullName:
          type: string
          description: The GitHub repo as owner/name.
          examples: [Odiethebest/SprintProof]
        timezone:
          type: string
          description: An IANA timezone.
          default: America/Los_Angeles
    Invite:
      type: object
      required: [id, role, token, expiresAt]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [MEMBER, INSTRUCTOR]
        token:
          type: string
          description: The last part of the invite link, `/invite/{token}`.
        expiresAt:
          type: string
          format: date-time
    WebhookSecretRotation:
      type: object
      required: [last4]
      properties:
        last4:
          type: string
          description: The new secret's last 4 characters, as Settings shows them.
          example: 3f9a
    Membership:
      type: object
      required: [teamId, role]
      properties:
        teamId:
          type: string
        role:
          $ref: "#/components/schemas/Role"
    Role:
      type: string
      enum: [LEAD, MEMBER, INSTRUCTOR]
    Sprint:
      type: object
      required:
        [
          id,
          teamId,
          name,
          startDate,
          endDate,
          standupsPerPerson,
          reviewsPerPerson,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
        teamId:
          type: string
        name:
          type: string
        startDate:
          type: string
          format: date
          description: First day, in the team's timezone.
        endDate:
          type: string
          format: date
          description: Last day, in the team's timezone.
        standupsPerPerson:
          type: integer
        reviewsPerPerson:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SprintList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Sprint"
        nextCursor:
          type: [string, "null"]
    CreateSprintInput:
      type: object
      required: [name, startDate, endDate]
      properties:
        name:
          type: string
          maxLength: 100
          description: Trimmed; NUL characters are rejected.
        startDate:
          type: string
          format: date
          description: Calendar date in years 2000 through 2100.
        endDate:
          type: string
          format: date
          description: Calendar date in years 2000 through 2100.
        standupsPerPerson:
          type: integer
          minimum: 1
          maximum: 20
          default: 3
        reviewsPerPerson:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
    UpdateSprintInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          description: Trimmed; NUL characters are rejected.
        startDate:
          type: string
          format: date
          description: Calendar date in years 2000 through 2100.
        endDate:
          type: string
          format: date
          description: Calendar date in years 2000 through 2100.
        standupsPerPerson:
          type: integer
          minimum: 1
          maximum: 20
        reviewsPerPerson:
          type: integer
          minimum: 1
          maximum: 20
    RequirementProgress:
      type: object
      required: [count, required, remaining, status]
      properties:
        count:
          type: integer
        required:
          type: integer
        remaining:
          type: integer
          description: How many to go; 0 once met.
        status:
          type: [string, "null"]
          enum: [MET, ON_TRACK, AT_RISK, MISSED, null]
          description: |
            `null`: the sprint has not started. `MET`: count reached the requirement. `ON_TRACK`: not met, more than 2 days
            left. `AT_RISK`: not met, 2 or fewer days left. `MISSED`: not met, the
            sprint has ended.
    MemberSummary:
      type: object
      required:
        [
          userId,
          name,
          githubLogin,
          role,
          commits,
          pullRequests,
          standups,
          reviews,
        ]
      properties:
        userId:
          type: string
        name:
          type: [string, "null"]
        githubLogin:
          type: [string, "null"]
        role:
          type: string
          enum: [LEAD, MEMBER]
        commits:
          type: integer
          description: Distinct commits pushed during the sprint, by commit author.
        pullRequests:
          type: integer
          description: PRs opened during the sprint.
        standups:
          $ref: "#/components/schemas/RequirementProgress"
        reviews:
          $ref: "#/components/schemas/RequirementProgress"
    SprintSummary:
      type: object
      required: [sprint, countsAsOf, members]
      properties:
        sprint:
          type: object
          required:
            [
              id,
              name,
              startDate,
              endDate,
              standupsPerPerson,
              reviewsPerPerson,
              state,
              daysLeft,
            ]
          properties:
            id:
              type: string
            name:
              type: string
            startDate:
              type: string
              format: date
            endDate:
              type: string
              format: date
            standupsPerPerson:
              type: integer
            reviewsPerPerson:
              type: integer
            state:
              type: string
              enum: [UPCOMING, CURRENT, ENDED]
            daysLeft:
              type: [integer, "null"]
              description: |
                The end date minus today, plus 1 because today counts. 0 once the
                sprint has ended. `null` before the sprint starts (`state` is
                `UPCOMING`), like each requirement's `status`.
        countsAsOf:
          type: string
          format: date-time
          description: When the counts were taken.
        members:
          type: array
          description: Leads and members, leads first.
          items:
            $ref: "#/components/schemas/MemberSummary"
    StandupInput:
      type: object
      required: [yesterday, today]
      properties:
        formDate:
          type: string
          format: date
          description: Day displayed when the form rendered. Optional; if different from today in the team timezone, returns 409 STANDUP_DAY_CHANGED and saves nothing. The server always chooses the stored date.
        yesterday:
          type: string
          minLength: 1
          maxLength: 1000
        today:
          type: string
          minLength: 1
          maxLength: 1000
        blockers:
          type: [string, "null"]
          maxLength: 1000
          description: Optional. An empty answer is stored as null.
    Standup:
      type: object
      required:
        [
          id,
          sprintId,
          userId,
          date,
          yesterday,
          today,
          blockers,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
        sprintId:
          type: string
          description: |
            The sprint it's listed under: the one whose dates contain its day. It
            changes when a lead moves that day into another sprint.
        userId:
          type: string
        date:
          type: string
          format: date
          description: The day it was filed under, in the team's timezone.
        yesterday:
          type: string
        today:
          type: string
        blockers:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: Later than createdAt when the standup was edited.
    StandupWithAuthor:
      allOf:
        - $ref: "#/components/schemas/Standup"
        - type: object
          required: [author]
          properties:
            author:
              type: object
              required: [name, githubLogin, avatarUrl]
              properties:
                name:
                  type: [string, "null"]
                githubLogin:
                  type: [string, "null"]
                avatarUrl:
                  type: [string, "null"]
    StandupList:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/StandupWithAuthor"
        nextCursor:
          type: [string, "null"]
    RetroItemInput:
      type: object
      required: [column, text]
      properties:
        column:
          type: string
          enum: [WENT_WELL, TO_IMPROVE]
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: Spaces around the text are trimmed.
    RetroItem:
      type: object
      required: [id, column, text, author, voteCount, hasVoted, createdAt]
      properties:
        id:
          type: string
        column:
          type: string
          enum: [WENT_WELL, TO_IMPROVE]
        text:
          type: string
        author:
          type: object
          required: [userId, name, githubLogin]
          properties:
            userId:
              type: string
            name:
              type: [string, "null"]
            githubLogin:
              type: [string, "null"]
        voteCount:
          type: integer
          minimum: 0
        hasVoted:
          type: boolean
          description: Whether you voted for it.
        createdAt:
          type: string
          format: date-time
    ActionItem:
      type: object
      required: [id, sprintId, retroItemId, text, voteCount, isDone]
      properties:
        id:
          type: string
        sprintId:
          type: string
          description: The sprint it was carried into, the one after the retro's sprint.
        retroItemId:
          type: string
          description: The "To improve" item it came from.
        text:
          type: string
        voteCount:
          type: integer
          minimum: 0
          description: The votes its item had when the retro closed.
        isDone:
          type: boolean
    Retro:
      type: object
      required:
        [id, sprintId, closedAt, createdAt, votesLeft, items, actionItems]
      properties:
        id:
          type: string
        sprintId:
          type: string
        closedAt:
          type: [string, "null"]
          format: date-time
          description: null while the retro is open.
        createdAt:
          type: string
          format: date-time
        votesLeft:
          type: [integer, "null"]
          minimum: 0
          maximum: 3
          description: Your votes left in this retro; null for an instructor, who doesn't vote.
        items:
          type: array
          description: Both columns, most votes first; ties go to the earliest created.
          items:
            $ref: "#/components/schemas/RetroItem"
        actionItems:
          type: array
          description: The action items closing made, in the same order; empty while open.
          items:
            $ref: "#/components/schemas/ActionItem"
    RetroVoteState:
      type: object
      required: [itemId, voteCount, hasVoted, votesLeft]
      properties:
        itemId:
          type: string
        voteCount:
          type: integer
          minimum: 0
        hasVoted:
          type: boolean
        votesLeft:
          type: integer
          minimum: 0
          maximum: 3
    NewApiToken:
      type: object
      required: [id, name, token, last4, createdAt, lastUsedAt]
      properties:
        id:
          type: string
        name:
          type: string
        token:
          type: string
          description: The full token, `spk_live_` and 43 characters. Copy it now; it isn't shown again.
        last4:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, "null"]
          format: date-time
