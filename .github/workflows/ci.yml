name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# On a PR, a new push makes the previous run obsolete, so cancel it.
# On main, every merge commit needs its own result: two merges a few seconds
# apart cancelled the first run (15f23ec, cef11d7). Grouping main runs by SHA
# also avoids GitHub dropping a pending run when a third merge queues behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  # Fails on high or critical advisories only. Moderate ones stay in the log:
  # as of Nov 7 there are 8, all in typescript-eslint via eslint-config-next,
  # with no fix short of a breaking `npm audit fix --force`.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm audit reads package-lock.json, so no npm ci is needed.
      - name: npm audit
        run: npm audit --audit-level=high

  unit-tests:
    name: Unit tests
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        # 17 matches Supabase (decision 002); local Docker stays on 16.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sprintproof_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sprintproof_test

  e2e:
    name: E2E tests
    needs: unit-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sprintproof_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sprintproof_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Apply migrations
        run: npx prisma migrate deploy

      # Auth settings are read per request (auth-session.ts), so the build
      # doesn't need them.
      - name: Build
        run: npm run build

      # A throwaway secret for this run's sessions only.
      - name: Generate AUTH_SECRET
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          echo "AUTH_SECRET=$secret" >> "$GITHUB_ENV"

      # One worker: the specs share one database (AGENTS.md §1 Testing strategy).
      # AUTH_TRUST_HOST lets Auth.js accept localhost under `next start`.
      - name: Playwright
        run: npx playwright test --workers=1
        env:
          E2E_TEST_AUTH: "true"
          AUTH_TRUST_HOST: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  build:
    name: Production build
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
